<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Discover campus events, register, and manage your university calendar with CampusLoop.">
  <meta name="theme-color" content="#163a2c">
  <title>CampusLoop · Campus events</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script defer src="/assets/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="wordmark" href="#home"><span class="brand-icon" aria-hidden="true">◎</span>CampusLoop</a>
      <nav id="nav" aria-label="Main navigation">
        <a href="#home">Home</a><a href="#events">Explore</a><a href="#about">About</a>
      </nav>
      <div id="account" class="account"></div>
    </div>
  </header>
  <div id="preview-banner" hidden></div>
  <div id="feedback" class="wrap" role="status" aria-live="polite"></div>
  <main id="main" class="wrap main" tabindex="-1">
    <p class="subtle" role="status">Loading CampusLoop…</p>
  </main>
  <footer class="site-footer">
    <div class="wrap footer-inner">
      <a class="wordmark" href="#home"><span class="brand-icon" aria-hidden="true">◎</span>CampusLoop</a>
      <a class="text-link" href="#about">About CampusLoop</a>
    </div>
  </footer>
  <dialog id="confirm" aria-labelledby="confirm-title">
    <form method="dialog" class="confirm-form">
      <h2 id="confirm-title"></h2>
      <p id="confirm-description" class="subtle"></p>
      <div class="actions">
        <button class="button outline" value="dismiss" autofocus>Go back</button>
        <button id="confirm-action" class="button danger" value="confirm"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
